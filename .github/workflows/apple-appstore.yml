name: Apple App Store (iPhone, iPad, Mac)

# Builds Iron Making for iPhone / iPad and for Mac on GitHub's Mac machines (no Mac needed),
# and uploads both to App Store Connect → TestFlight → submit for review there.
#
# Run it: GitHub → Actions → "Apple App Store (iPhone, iPad, Mac)" → Run workflow.
# Without the secrets below it only checks that both apps compile.
# Secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID        10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID           App Store Connect API key ID        (App Store Connect → Users and Access → Integrations → Keys, role Admin)
#   ASC_ISSUER_ID        Issuer ID shown on the same page
#   ASC_KEY_P8           full text of the downloaded AuthKey_XXXX.p8 file

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to App Store Connect (TestFlight)'
        type: boolean
        default: true
      platforms:
        description: 'Which apps'
        type: choice
        options: [both, iOS, macOS]
        default: both

jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd apple && xcodegen generate

      - name: Compile check (no signing)
        run: |
          P="${{ inputs.platforms }}"
          if [ "$P" != "macOS" ]; then
            xcodebuild -project apple/IronMaking.xcodeproj -scheme IronMaking-iOS -configuration Release \
              -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build -quiet
          fi
          if [ "$P" != "iOS" ]; then
            xcodebuild -project apple/IronMaking.xcodeproj -scheme IronMaking-macOS -configuration Release \
              -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build -quiet
          fi

      - name: Archive, sign and upload to App Store Connect
        if: ${{ inputs.upload }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::Apple secrets are not set: only the compile check ran. See APPLE-APP-STORE.md."
            exit 0
          fi
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          BUILD=$((184 + BUILD_NUMBER))          # always higher than the last upload
          P="${{ inputs.platforms }}"
          for OS in iOS macOS; do
            if [ "$P" != "both" ] && [ "$P" != "$OS" ]; then continue; fi
            echo "== $OS (build $BUILD)"
            xcodebuild -project apple/IronMaking.xcodeproj -scheme "IronMaking-$OS" -configuration Release \
              -destination "generic/platform=$OS" -archivePath "build/IronMaking-$OS.xcarchive" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD" "${AUTH[@]}" archive -quiet
            xcodebuild -exportArchive -archivePath "build/IronMaking-$OS.xcarchive" \
              -exportOptionsPlist apple/ExportOptions.plist -exportPath "build/export-$OS" "${AUTH[@]}"
          done
          rm -f "$KEY"
          echo "Uploaded. In App Store Connect → Iron Making → TestFlight, the build appears after Apple's processing (10–30 min)."
