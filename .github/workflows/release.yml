name: Publish Android app

# Publishes the free Android APK as a GitHub release.
# The Windows, Mac and Office PC versions are paid: they are sold in the app (Download the app → pay by UPI)
# and shared from the owner's Google Drive after the payment is approved, so they are not published here.
# This also removes Windows / Mac / browser-zip files from older releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example 5.9.2'
        required: true
        default: '6.2'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "tag=v$V" >> "$GITHUB_OUTPUT"
      - name: Remove paid versions from all releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            for a in $(gh release view "$t" --json assets --jq '.assets[].name' | grep -E 'Windows|Mac-|Browser-NoInstall' || true); do
              echo "delete $t/$a"; gh release delete-asset "$t" "$a" --yes
            done
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          V: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist && cp downloads/*.apk dist/
          sed "s/{V}/$V/g" .github/release-notes.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "Iron Making $V" --notes-file notes.md --latest
          else
            gh release create "$TAG" dist/* --title "Iron Making $V" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
