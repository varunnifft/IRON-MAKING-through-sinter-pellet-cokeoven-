name: Publish Iron Making

# Publishes everything as a GitHub release:
#   - Android phone APK (from downloads/)
#   - Browser (no-install) zip (from downloads/)
#   - Windows x64 zip and Mac zips (Apple Silicon + Intel), built here from app/ + desktop/
# All free since 6.3.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example 6.3'
        required: true
        default: '6.3'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Install Pillow (for peicon.py — writes the Windows icon into the exe)
        run: pip install --quiet Pillow

      - name: Build Windows and Mac desktop packages
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # package_desktop.sh downloads Electron + rcodesign and packages the Windows/Mac zips into dist/
          bash tools/package_desktop.sh
          ls -lh dist/

      - name: Collect release assets
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          # Everything that goes to the release lands in dist/
          mkdir -p dist
          cp downloads/*.apk dist/
          # Browser zip comes prebuilt in downloads/ (small, under 10 MB)
          cp downloads/IronMaking-*-Browser-NoInstall.zip dist/ 2>/dev/null || true
          ls -lh dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          V: ${{ steps.v.outputs.version }}
        run: |
          sed "s/{V}/$V/g" .github/release-notes.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "Iron Making $V" --notes-file notes.md --latest
          else
            gh release create "$TAG" dist/* --title "Iron Making $V" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
