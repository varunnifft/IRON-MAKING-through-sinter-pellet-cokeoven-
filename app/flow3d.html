<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Process flow 3D</title>
<style>
@font-face{font-family:"InterV";src:url("fonts/InterVariable.woff2") format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
:root{
  /* Layout: full-bleed 3D plant model with a process sheet docked right (stacked below on phones) */
  --bg:#11161b; --panel:#192027; --raise:#212a32; --line:#2e3a45; --ink:#e3e8ec; --muted:#8f9ca8;
  --amber:#FFB547; --steel:#7fb0cf;
  --f-display:'InterV',Roboto,'Segoe UI',system-ui,sans-serif;
  --f-body:Roboto,'Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'Roboto Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;overflow:hidden}
.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:100%}
.view{position:relative;min-width:0;overflow:hidden;background:var(--bg)}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:24px 22px 40px;min-width:0}

.top{position:absolute;top:12px;left:max(14px,env(safe-area-inset-left,0px));right:14px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.top > *{pointer-events:auto}
.brand .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.brand h1{font-family:var(--f-display);font-weight:750;font-size:24px;line-height:1.05;margin:2px 0 4px;letter-spacing:-.01em;text-wrap:balance}
.brand .hint{font-size:12px;color:var(--muted)}
.ctrls{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:500 13px/1 var(--f-body);color:var(--ink);background:rgba(25,32,39,.88);border:1px solid var(--line);border-radius:6px;padding:9px 12px;cursor:pointer;backdrop-filter:blur(4px)}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.step:focus-visible,.lbl:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn.on{background:var(--amber);color:#1a1307;border-color:var(--amber)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:rgba(25,32,39,.88)}
.seg .btn{border:0;border-radius:0;background:transparent;padding:9px 10px;font-family:var(--f-mono);font-size:12px}
.seg .btn.on{background:var(--raise);color:var(--amber)}

.steps{position:absolute;left:0;right:0;bottom:0;padding:10px max(14px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;overflow-x:auto;background:linear-gradient(to top,rgba(17,22,27,.95),rgba(17,22,27,0));scrollbar-width:thin}
.step{flex:0 0 auto;display:flex;gap:7px;align-items:baseline;font:500 13px/1.1 var(--f-body);color:var(--muted);background:rgba(25,32,39,.9);border:1px solid var(--line);border-radius:6px;padding:8px 11px;cursor:pointer;white-space:nowrap}
.step b{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--muted)}
.step:hover{color:var(--ink)}
.step.on{color:var(--ink);border-color:var(--amber);box-shadow:inset 0 -2px 0 var(--amber)}
.step.on b{color:var(--amber)}

.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font:500 11.5px/1.2 var(--f-body);color:var(--ink);background:rgba(17,22,27,.82);border:1px solid var(--line);border-radius:4px;padding:4px 7px;white-space:nowrap;display:flex;gap:6px;align-items:center;pointer-events:auto}
.lbl i{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
.lbl.area{font-family:var(--f-display);font-size:13px;font-weight:650;letter-spacing:0;padding:4px 9px;cursor:pointer;border-color:#46525d}
.lbl.area span{font-family:var(--f-mono);font-size:10.5px;color:var(--amber)}
.lbl.area:hover{border-color:var(--amber)}

/* Panel */
.p-eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.panel h2{font-family:var(--f-display);font-size:28px;font-weight:750;line-height:1.1;letter-spacing:-.015em;margin:6px 0 10px;text-wrap:balance}
.lead{color:#c9d1d8;margin:0 0 18px;max-width:62ch}
.panel h3{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.panel ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.panel ul.what li{position:relative;padding-left:16px}
.panel ul.what li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:2px;background:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:4px 8px}
.chip i{width:10px;height:10px;border-radius:2px;border:1px solid rgba(255,255,255,.18)}
.io{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:start}
.io > span{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:5px;letter-spacing:.06em}
.params{display:grid;grid-template-columns:minmax(0,1fr) auto;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.params div{padding:7px 10px;border-top:1px solid var(--line);min-width:0}
.params div:nth-child(-n+2){border-top:0}
.params .k{color:#c5cdd4}
.params .v{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.params div:nth-child(4n+1),.params div:nth-child(4n+2){background:rgba(255,255,255,.02)}
.equip li{display:flex;gap:8px}
.equip li::before{content:"▪";color:var(--steel)}
.note{font-size:12.5px;color:var(--muted);margin-top:12px;border-left:2px solid var(--line);padding-left:10px}
.flowline{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:4px}
.flowline a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--muted);cursor:pointer}
.flowline a:hover{color:var(--amber);border-color:var(--amber)}
.mtable{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mtable > div{padding:7px 10px;border-top:1px solid var(--line);min-width:0}
.mtable > div:nth-child(-n+2){border-top:0}
.mtable .m{display:flex;gap:8px;align-items:flex-start;font-weight:500;white-space:nowrap}
.mtable .m i{width:11px;height:11px;border-radius:2px;margin-top:4px;border:1px solid rgba(255,255,255,.18)}
.mtable .r{color:#c5cdd4;font-size:13px}
.mtable .grp{grid-column:1/-1;background:var(--raise);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);padding:6px 10px}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px}
.chain a{background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:3px 7px;color:var(--ink);text-decoration:none;cursor:pointer}
.chain a:hover{border-color:var(--amber)}
.chain em{color:var(--muted);font-style:normal}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono);font-size:12px}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:56% 44%;height:100%}
  .panel{border-left:0;border-top:1px solid var(--line);padding:16px 16px 28px}
  .brand h1{font-size:19px}
  .brand .eyebrow{font-size:10px}
  .brand .hint{display:none}
  .panel h2{font-size:24px}
  .btn{padding:8px 10px}
  .seg .btn{padding:8px 8px}
  .step{padding:7px 9px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important} }
</style>

</head>
<body>
<div class="app">
  <section class="view" id="view" aria-label="3D model of the sinter plant">
    <canvas id="c"></canvas>
    <div class="loading" id="loading">Loading 3D model…</div>
    <div class="labels" id="labels"></div>
    <div class="top">
      <div class="brand">
        <div class="eyebrow">Sinter plant · process flow</div>
        <h1>Yard to BF Bunker</h1>
        <div class="hint">Drag to orbit · scroll or pinch to zoom · right-drag to pan</div>
      </div>
      <div class="ctrls">
        <button class="btn" id="prev" aria-label="Previous stage">◀</button>
        <button class="btn" id="tour">▶ Play tour</button>
        <button class="btn" id="next" aria-label="Next stage">▶</button>
        <div class="seg" role="group" aria-label="Animation speed">
          <button class="btn" data-speed="0">❚❚</button>
          <button class="btn" data-speed="0.5">0.5×</button>
          <button class="btn on" data-speed="1">1×</button>
          <button class="btn" data-speed="2">2×</button>
        </div>
      </div>
    </div>
    <nav class="steps" id="steps" aria-label="Process stages"></nav>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<script src="lib/three.min.js"></script>
<script>
(function(){
'use strict';

/* ---------------- Materials (colours used in model + panel) ---------------- */
const MAT = {
  ore:   {name:'Iron ore fines', c:'#8f3c27', role:'Main iron source, 0–10 mm, Fe 58–64%'},
  ore2:  {name:'Iron ore fines (grade 2)', c:'#b0583c', role:'Second grade blended for Fe / Al₂O₃ control'},
  lime:  {name:'Limestone', c:'#d6d0c2', role:'CaO flux; sets sinter basicity (CaO/SiO₂)'},
  dolo:  {name:'Dolomite', c:'#a8a294', role:'MgO flux; slag fluidity, lower RDI'},
  qtz:   {name:'Quartzite', c:'#ece5d2', role:'SiO₂ trim when ore silica is low'},
  coke:  {name:'Coke breeze / anthracite', c:'#202124', role:'Solid fuel, 4–6% of mix'},
  blime: {name:'Burnt lime', c:'#f6f4ec', role:'Binder; better granulation and faster sintering'},
  scale: {name:'Mill scale', c:'#56606a', role:'FeO-rich revert; adds Fe and heat'},
  dust:  {name:'Flue dust / ESP dust / sludge', c:'#6f5947', role:'Plant reverts carrying Fe and C'},
  ldslag:{name:'LD slag', c:'#7e8577', role:'CaO, MgO, Fe and Mn units from the steel shop'},
  mn:    {name:'Mn ore fines (optional)', c:'#4a4058', role:'Mn control in hot metal'},
  base:  {name:'Base mix (blended)', c:'#8a4a34', role:'Homogenised ore + reverts from the blending bed'},
  ret:   {name:'Return fines (<5 mm)', c:'#5f4034', role:'Internal circulating load, 20–35% of mix'},
  hearth:{name:'Hearth layer (10–20 mm)', c:'#8a6450', role:'Protects pallet grate bars'},
  water: {name:'Water', c:'#5aa7d8', role:'Granulation moisture 6.5–8%'},
  steam: {name:'Steam', c:'#c8dbe6', role:'Preheats mix to 55–70 °C'},
  gas:   {name:'Mixed gas (BF / CO gas) + air', c:'#f08a2a', role:'Ignition hood fuel'},
  air:   {name:'Process air (suction / cooling)', c:'#9fc3d8', role:'Drawn down the bed; blown up the cooler'},
  mix:   {name:'Raw mix', c:'#5a4a40', role:'Proportioned dry materials'},
  gmix:  {name:'Granulated mix', c:'#4b3d35', role:'Wet micro-pellets, 3–8 mm'},
  cake:  {name:'Hot sinter cake', c:'#ff6a1c', role:'Discharged at 600–800 °C'},
  cool:  {name:'Cooled sinter', c:'#6d4f42', role:'<150 °C after cooler'},
  product:{name:'Product sinter (5–40 mm)', c:'#7a5244', role:'To BF stock house'},
  wgas:  {name:'Waste gas', c:'#9aa3aa', role:'To ESP, fan and stack'},
  pellet:{name:'Pellets', c:'#4d3a33', role:'BF ferrous burden'},
  lump:  {name:'Lump ore', c:'#7d3a26', role:'BF ferrous burden'},
  bfcoke:{name:'BF coke', c:'#2c2c2e', role:'BF fuel and permeable layer'}
};

/* ---------------- Stage content ---------------- */
const STAGES = [
 {short:'Overview', name:'Sinter making, end to end',
  cam:{t:[10,0,4], r:265, th:0.32, ph:0.92}, at:[0,0,0],
  lead:'A sinter plant turns fine ore, fluxes, fuel and plant reverts into a strong, porous, fluxed lump sized for the blast furnace. Fines that cannot be charged directly become 60–80% of the ferrous burden. Pick any stage below or press Play tour.'
 },
 {short:'RMHS yard', name:'Raw material yard (RMHS)',
  cam:{t:[-130,2,-2], r:78, th:0.5, ph:0.95}, at:[-132,12,-4],
  lead:'Every input arrives here first. Each material is stored in its own pile so its chemistry is known before it enters the plant.',
  what:['Rakes are emptied at the wagon tippler or track hopper; trucks tip at ground hoppers.','Stackers build a separate pile for each material and grade.','Samples are drawn per rake and per pile for Fe, SiO₂, Al₂O₃, CaO, MgO, LOI, moisture and size.','Reclaimers send ore and reverts to the blending bed, and fluxes and fuel to the crushing house.'],
  inp:['ore','ore2','lime','dolo','qtz','coke','scale','dust','ldslag','mn'],
  out:['ore','lime','dolo','coke','dust'],
  params:[['Iron ore fines size','0–10 mm'],['Fe in ore fines','58–64 %'],['Al₂O₃ in ore (preferred)','< 2.5–3 %'],['Moisture as received','6–10 %'],['Limestone / dolomite as received','0–40 mm'],['Coke breeze as received','0–25 mm']],
  equip:['Wagon tippler and track hopper','Rail-mounted stacker / reclaimer','Belt conveyors with belt weighers','Auto sampler and sample preparation']
 },
 {short:'Blending bed', name:'Bedding and blending',
  cam:{t:[-80,3,-2], r:52, th:0.75, ph:1.0}, at:[-80,12,0],
  lead:'Ore grades vary rake to rake. Laying them down in hundreds of thin layers and cutting across all layers at once evens that out.',
  what:['A travelling stacker lays ore fines, some reverts and part of the flux in thin layers (chevron or windrow method).','A bridge or bucket-wheel reclaimer cuts the full face of the bed, so every slice is an average of all layers.','The base mix then has steady Fe and SiO₂, which keeps basicity steady without constant recipe changes.'],
  inp:['ore','ore2','scale','dust','ldslag'],
  out:['base'],
  params:[['Layers per bed','300–600'],['Fe std. deviation after blending','≤ 0.3–0.5 %'],['SiO₂ std. deviation after blending','≤ 0.15–0.2 %'],['Blending ratio (σ in / σ out)','3–6'],['Bed height (typical)','10–14 m']],
  equip:['Blending stacker (chevron)','Bridge-type drum or bucket-wheel reclaimer','Base-mix conveyor to proportioning']
 },
 {short:'Crushing', name:'Flux and fuel crushing',
  cam:{t:[-60,4,24], r:40, th:0.45, ph:1.05}, at:[-58,13,24],
  lead:'Flux and fuel must be fine enough to react inside the short time the flame front passes, but fuel must not be so fine that it burns off early.',
  what:['Limestone and dolomite go through a hammer mill or impactor in closed circuit with a vibrating screen.','Coke breeze or anthracite is ground in a rod mill or 4-roll crusher.','Screen oversize returns to the crusher. Crushed flux and fuel go to their bins in the proportioning building.'],
  inp:['lime','dolo','qtz','coke'],
  out:['lime','dolo','coke'],
  params:[['Flux after crushing','≥ 85–90 % < 3 mm'],['Coke breeze after crushing','80–85 % < 3 mm'],['Coke breeze < 0.5 mm','≤ 15–20 %'],['Fixed carbon in breeze','78–85 %'],['Breeze moisture','≤ 10 %']],
  equip:['Hammer mill / impactor (flux)','Rod mill or 4-roll crusher (fuel)','Vibrating screens in closed circuit','Bag filter dust extraction']
 },
 {short:'Proportioning', name:'Proportioning bins',
  cam:{t:[-24,9,0], r:50, th:0.42, ph:1.1}, at:[-24,22,0],
  lead:'Each material has its own bin and weigh feeder. Feed rates follow a recipe calculated from the target sinter chemistry.',
  what:['Weigh feeders under each bin discharge at a set rate onto one collecting belt.','Limestone is set by the basicity target, dolomite by the MgO target and coke breeze by the carbon target.','Burnt lime comes from a closed silo filled pneumatically and is dosed by a rotary or screw feeder.','The recipe is recalculated whenever ore analysis changes.'],
  inp:['base','ore','lime','dolo','coke','blime','scale','dust','ret'],
  out:['mix'],
  params:[['Iron-bearing (ore + base mix)','55–65 % of new feed'],['Limestone','8–14 %'],['Dolomite','3–7 %'],['Coke breeze','4–6 %'],['Fixed C in mix','3.5–4.5 %'],['Burnt lime','1–3 %'],['Mill scale + reverts','3–8 %'],['Return fines','20–35 % of total mix'],['Weigh feeder accuracy','± 0.5–1 %']],
  equip:['Proportioning bins with level and load cells','Weigh belt feeders','Burnt lime silo with rotary feeder','Collecting belt to mixing drum','Recipe / ratio controller in DCS'],
  note:'Percentages are typical industry ranges. Your actual recipe comes from your own raw material analysis and target sinter chemistry.'
 },
 {short:'Mixing drums', name:'Mixing and granulation',
  cam:{t:[19,6,0], r:46, th:0.5, ph:1.1}, at:[19,14,0],
  lead:'Water turns the fine mix into small balls (quasi-particles) so air can pass through the bed during sintering.',
  what:['The primary drum mixes the materials evenly and adds most of the water through spray nozzles.','The secondary (nodulizing) drum rolls the wet mix so fines stick to coarser nuclei and form 3–8 mm granules.','Steam is added to heat the mix, which reduces the over-wet zone that forms when moisture condenses in the cold lower bed.'],
  inp:['mix','water','steam'],
  out:['gmix'],
  params:[['Mix moisture','6.5–8.0 %'],['Primary drum residence','1–2 min'],['Secondary drum residence','2–4 min'],['Drum speed','6–8 rpm'],['Drum slope','2–3°'],['Mix temperature after steam','55–70 °C'],['Mean granule size','3–5 mm']],
  equip:['Primary mixing drum','Secondary / nodulizing drum','Water flow control with online moisture gauge','Steam lances']
 },
 {short:'Charging & ignition', name:'Charging and ignition',
  cam:{t:[46,11,0], r:30, th:0.8, ph:1.05}, at:[47,20,0],
  lead:'The bed is laid on the moving pallets in two parts: a protective hearth layer, then the granulated mix. The ignition hood lights the top.',
  what:['A 30–50 mm hearth layer of 10–20 mm sinter goes onto the grate bars first so the mix does not stick or burn the bars.','Mix flows from the surge bin through the roll feeder and inclined chute to form a level bed. Coarse granules settle lower, which helps permeability.','Burners in the ignition hood fire mixed gas to ignite the coke breeze at the bed surface.'],
  inp:['gmix','hearth','gas'],
  out:['cake'],
  params:[['Hearth layer','30–50 mm of 10–20 mm'],['Bed height incl. hearth','600–800 mm'],['Ignition temperature','1100–1200 °C'],['Ignition time','1–1.5 min'],['Ignition energy','≈ 40–60 MJ/t sinter'],['Bed bulk density','1.7–1.9 t/m³']],
  equip:['Hearth layer bin','Surge bin on load cells','Roll feeder and chute / reflector plate','Bed leveller','Ignition hood with burners']
 },
 {short:'Sinter strand', name:'Sintering on the strand',
  cam:{t:[78,8,-6], r:82, th:0.18, ph:1.12}, at:[74,13,0],
  lead:'The main fan pulls air down through the bed. The flame front moves down while the pallets move forward, so it reaches the grate near the end of the strand.',
  what:['Top to bottom the bed has: cooled sinter, combustion zone (1250–1350 °C, partial melting), calcination zone, drying zone and wet zone. The model shows the glowing front sloping down along the strand.','Burn-through point (BTP) is where the flame reaches the grate. It is held at the second- or third-last windbox by adjusting strand speed.','Waste gas leaves through the windboxes, main duct, ESP and main fan to the stack.'],
  inp:['cake','air'],
  out:['cake','wgas'],
  params:[['Strand speed','1.5–4 m/min'],['Suction under bed','1200–1800 mmWC'],['Flame front speed','15–30 mm/min'],['Peak bed temperature','1250–1350 °C'],['Waste gas temp. at BTP','300–400 °C'],['Productivity','1.3–1.8 t/m²/h'],['Solid fuel rate','45–60 kg/t sinter']],
  equip:['Pallet cars with grate bars','Windboxes and dust valves','Main gas duct','Main ESP','Main exhaust fan','Stack','Windbox thermocouples (BTP control)']
 },
 {short:'Crush & cool', name:'Crushing and cooling',
  cam:{t:[116,4,0], r:52, th:0.72, ph:0.9}, at:[118,14,0],
  lead:'The hot cake breaks off at the discharge end, is crushed, and is cooled in a rotating cooler before it can go on belts.',
  what:['A single-roll spiked crusher breaks the cake as it falls off the pallets.','The annular (circular) cooler carries hot sinter round once while fans blow air up through it.','Hot air from the first zone can be sent to a waste heat boiler or used as ignition combustion air.'],
  inp:['cake','air'],
  out:['cool'],
  params:[['Crusher discharge','< 150 mm'],['Sinter into cooler','700–850 °C'],['Sinter out of cooler','< 120–150 °C'],['Cooling time','50–70 min'],['Cooling air','1800–2200 Nm³/t'],['Cooler bed depth','1.2–1.5 m']],
  equip:['Single-roll spiked crusher','Hot screen (where fitted)','Annular cooler with cooling fans','Waste heat recovery (optional)']
 },
 {short:'Screening', name:'Screening and sizing',
  cam:{t:[124,7,28], r:46, th:0.6, ph:1.0}, at:[124,17,27],
  lead:'Cooled sinter is sized into three streams: product for the furnace, a hearth layer cut, and return fines that go back to proportioning.',
  what:['Multi-deck screens (with a secondary crusher where fitted) size the sinter.','Under 5 mm goes back as return fines. A 10–20 mm cut goes to the hearth layer bin. The rest is product sinter.','Product is sampled every shift for size, chemistry and strength.'],
  inp:['cool'],
  out:['product','hearth','ret'],
  params:[['Product size','5–40 mm (mean 18–25 mm)'],['Return fines','< 5 mm'],['Hearth layer cut','10–20 mm'],['Tumbler index (ISO 3271)','≥ 70–75 %'],['RDI (ISO 4696)','≤ 28–30 %'],['Reducibility (RI)','≥ 65 %'],['FeO','7–10 %'],['Basicity CaO/SiO₂','1.8–2.2'],['MgO','1.8–2.5 %']],
  equip:['Multi-deck cold screens','Secondary crusher','Product belt weigher','Auto sampler and test house (TI, RDI, RI)']
 },
 {short:'BF stock house', name:'BF stock house bunkers',
  cam:{t:[176,14,26], r:80, th:0.55, ph:1.05}, at:[166,22,27],
  lead:'Product sinter is carried by conveyor to the blast furnace stock house and stored in bunkers alongside coke, pellets and lump ore.',
  what:['Sinter is stored in dedicated bunkers next to the other burden materials.','Each bunker discharges through a vibro feeder and screen; under 5 mm fines go back to the sinter plant as BF return fines.','Material is weighed in batches and charged to the furnace top by conveyor or skip.'],

const flows = [];
const beltMat = M('#2c3237',{roughness:.95});
const frameMat = M(STEEL_D);
const lumpGeo = new THREE.DodecahedronGeometry(0.34,0);
const lumpMat = new THREE.MeshStandardMaterial({color:'#ffffff', roughness:.9, metalness:0});
const tmpO = new THREE.Object3D(), tmpC = new THREE.Color();
function conveyor(points, colors, opt){
  opt=opt||{};
  const P = points.map(p=>new V3(...p));
  const segs=[]; let L=0;
  for(let i=0;i<P.length-1;i++){
    const a=P[i], b=P[i+1], len=a.distanceTo(b);
    const belt = new THREE.Mesh(new THREE.BoxGeometry(1.3,0.22,len), beltMat);
    belt.position.copy(a).lerp(b,.5); belt.lookAt(b); scene.add(belt);
    const rail = new THREE.Mesh(new THREE.BoxGeometry(1.7,0.18,len), frameMat);
    rail.position.copy(belt.position); rail.position.y-=0.22; rail.quaternion.copy(belt.quaternion); scene.add(rail);
    for(let d=3; d<len; d+=7){ const p=a.clone().lerp(b,d/len); if(p.y>1.2) boxB(0.25,p.y-0.3,0.25,STEEL_D,p.x,0,p.z); }
    segs.push({a,b,len,start:L}); L+=len;
  }
  const n = Math.max(6, Math.round(L/(opt.gap||1.5)));
  const inst = new THREE.InstancedMesh(lumpGeo, lumpMat, n);
  const rot=[];
  for(let i=0;i<n;i++){ tmpC.set(colors[(i*7+3)%colors.length]); inst.setColorAt(i,tmpC); rot.push([Math.random()*6,Math.random()*6, 0.75+Math.random()*0.5]); }
  scene.add(inst);
  flows.push({segs,L,n,inst,rot,speed:opt.speed||4});
}
function updateFlows(t){
  for(const f of flows){
    for(let i=0;i<f.n;i++){
      let s = (i/f.n*f.L + t*f.speed) % f.L;
      let sg=f.segs[0]; for(const g of f.segs){ if(s>=g.start) sg=g; }
      const k=(s-sg.start)/sg.len;
      tmpO.position.copy(sg.a).lerp(sg.b,k); tmpO.position.y+=0.38;
      const r=f.rot[i]; tmpO.rotation.set(r[0],r[1],0); tmpO.scale.setScalar(r[2]);
      tmpO.updateMatrix(); f.inst.setMatrixAt(i,tmpO.matrix);
    }
    f.inst.instanceMatrix.needsUpdate=true;
  }
}

function drum(cx,cy,len,r,color){
  const g=new THREE.Group(); g.position.set(cx,cy,0); g.rotation.z=-0.04; scene.add(g);
  const spin=new THREE.Group(); g.add(spin);
  const shell=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,32,1,true), M(color,{side:THREE.DoubleSide,metalness:.3}));

  const bed=new THREE.Mesh(new THREE.BoxGeometry(len*0.95,0.5,r*1.1),M(C('gmix'))); bed.position.y=-r*0.7; g.add(bed);
  [-len/2+1.2,len/2-1.2].forEach(x=>{ boxB(1.4,cy-r-0.2,r*1.8,STEEL_D,cx+x,0,0); });
  return spin;
}

/* ---------------- Camera control ---------------- */
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const cur={t:new V3(10,0,4), r:265, th:0.32, ph:0.92};
const goal={t:new V3(10,0,4), r:265, th:0.32, ph:0.92};
function setGoalFromStage(i){ const c=STAGES[i].cam; goal.t.set(...c.t); goal.r=c.r; goal.th=c.th; goal.ph=c.ph; }
const ptrs=new Map(); let pinch0=0, mode='rot';
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); mode=(e.button===2||e.shiftKey||e.ctrlKey)?'pan':'rot'; if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y); } stopTour(); });
canvas.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return;
  const p=ptrs.get(e.pointerId), dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(pinch0>0){ goal.r=Math.min(420,Math.max(12,goal.r*pinch0/d)); } pinch0=d; return; }
  if(mode==='rot'){ goal.th-=dx*0.006; goal.ph=Math.min(1.48,Math.max(0.15,goal.ph-dy*0.005)); }
  else { const s=goal.r*0.0016; const fx=Math.cos(goal.th), fz=-Math.sin(goal.th); goal.t.x-= (dx*fx)*s; goal.t.z-= (dx*fz)*s; const bx=Math.sin(goal.th), bz=Math.cos(goal.th); goal.t.x-=dy*bx*s; goal.t.z-=dy*bz*s; }
});
const endPtr=e=>{ ptrs.delete(e.pointerId); pinch0=0; };
canvas.addEventListener('pointerup',endPtr); canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{ e.preventDefault(); goal.r=Math.min(420,Math.max(12,goal.r*Math.exp(e.deltaY*0.0012))); },{passive:false});

/* ---------------- Stage switching & tour ---------------- */
let stage=0, tourTimer=null, speed=1;
const tourBtn=document.getElementById('tour');
function setStage(i){
  stage=(i+STAGES.length)%STAGES.length;
  setGoalFromStage(stage);
  renderPanel(stage);
  stepsEl.querySelectorAll('.step').forEach((b,j)=>{ b.classList.toggle('on',j===stage); if(j===stage) b.scrollIntoView({block:'nearest',inline:'center',behavior:reduce?'auto':'smooth'}); });
}
function stopTour(){ if(tourTimer){ clearInterval(tourTimer); tourTimer=null; tourBtn.textContent='▶ Play tour'; tourBtn.classList.remove('on'); } }
tourBtn.addEventListener('click',()=>{
  if(tourTimer){ stopTour(); return; }
  tourBtn.textContent='❚❚ Pause tour'; tourBtn.classList.add('on');
  if(stage===0||stage===10) setStage(1); else setStage(stage+1);
  tourTimer=setInterval(()=>{ setStage(stage>=10?0:stage+1); },9000);
});
document.getElementById('prev').addEventListener('click',()=>{ stopTour(); setStage(stage-1); });
document.getElementById('next').addEventListener('click',()=>{ stopTour(); setStage(stage+1); });
document.querySelectorAll('[data-speed]').forEach(b=>b.addEventListener('click',()=>{ speed=+b.dataset.speed; document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('on',x===b)); }));
window.addEventListener('keydown',e=>{ if(e.target.closest('input,textarea')) return; if(e.key==='ArrowRight'){stopTour();setStage(stage+1);} if(e.key==='ArrowLeft'){stopTour();setStage(stage-1);} });

/* ---------------- Heat colours ---------------- */
const HEAT=[[0,'#3c3531'],[0.25,'#6e1d0f'],[0.5,'#d8410f'],[0.75,'#ff8a1f'],[0.92,'#ffc04a'],[1,'#fff0b8']].map(([t,c])=>[t,new THREE.Color(c)]);
function heat(T,out){ T=Math.max(0,Math.min(1,T)); for(let i=1;i<HEAT.length;i++){ if(T<=HEAT[i][0]){ const a=HEAT[i-1],b=HEAT[i]; return out.copy(a[1]).lerp(b[1],(T-a[0])/(b[0]-a[0])); } } return out.copy(HEAT[HEAT.length-1][1]); }
const RAW=new THREE.Color(C('gmix')), DRY=new THREE.Color('#6a5a4e'), HEARTH_C=new THREE.Color(C('hearth'));

/* ---------------- Resize ---------------- */
function resize(){ const w=view.clientWidth, h=view.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/Math.max(1,h); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(view); resize();

/* ---------------- Animate ---------------- */
let last=performance.now(), simT=0;
const tv=new V3();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; simT+=dt*speed; const t=simT;

  // camera
  const k = reduce?1:1-Math.pow(0.0015,dt);
  cur.t.lerp(goal.t,k); cur.r+=(goal.r-cur.r)*k; cur.th+=(goal.th-cur.th)*k; cur.ph+=(goal.ph-cur.ph)*k;
  camera.position.set(cur.t.x+cur.r*Math.sin(cur.ph)*Math.sin(cur.th), cur.t.y+cur.r*Math.cos(cur.ph), cur.t.z+cur.r*Math.sin(cur.ph)*Math.cos(cur.th));
  camera.lookAt(cur.t);

  updateFlows(t);

  // machines
  stacker.position.x = -132 + Math.sin(t*0.15)*14; stacker.children[2].rotation.y = Math.sin(t*0.3)*0.3;
  bStack.position.x = -80 + Math.sin(t*0.22)*11;
  harrow.rotation.y = t*2;
  hmRotor.rotation.y = t*8; rodMill.rotation.x = t*1.6;
  scr.position.y = 2.6 + Math.sin(t*40)*0.04;
  drum1.rotation.x = t*0.9; drum2.rotation.x = t*0.8;
  rollFeeder.rotation.y = t*1.5;
  sprA.rotation.y = -t*0.5; sprB.rotation.y = -t*0.5;
  fanImp.rotation.z = t*9;
  crushRoll.rotation.z = -t*1.2;
  coolerFans.forEach(g=>g.children.forEach((b,j)=>{ b.rotation.z = j*Math.PI/4 + t*10; }));
  decks.forEach((d,j)=>{ d.position.x = SHX + Math.sin(t*30+j)*0.06; });
  ignLight.intensity = 1.8 + Math.sin(t*13)*0.35 + Math.sin(t*31)*0.2;
  flame.material.opacity = 0.75 + Math.sin(t*17)*0.12;

  drops.forEach(d=>{ const p=(d.o + t*0.9)%1; d.m.position.set(4.4+ (d.o-0.5)*2.4, 11.2 - p*3.6, (d.o*7%1-0.5)*1.4); });
  puffs.forEach(p=>{ const q=(p.o + t*0.25)%1; p.m.position.set(25+q*1.5, 12.4 - q*3.4, -1 + (p.o-0.5)*2); p.m.scale.setScalar(0.6+q*0.9); p.m.material.opacity=0.55*(1-q); });
  smoke.forEach(s=>{ const q=(s.o + t*0.06)%1; s.m.position.set(118 + q*16 + Math.sin(q*9+s.o*6)*1.2, 48 + q*24, -24 - q*6); s.m.scale.setScalar(0.6+q*2.6); s.m.material.opacity=0.42*(1-q); });

  // strand pallets & flame front
  const off=(t*1.1)%(2*S_LEN);
  for(let i=0;i<NP;i++){
    const s=(i*PL+off)%(2*S_LEN);
    const top=s<S_LEN; const x= top? S_X0+s : S_X1-(s-S_LEN); const y= top?TOP_Y:BOT_Y;
    tmpO.position.set(x,y,0); tmpO.rotation.set(0,0,0); tmpO.scale.set(1,1,1); tmpO.updateMatrix(); palletInst.setMatrixAt(i,tmpO.matrix);
    const d = Math.max(0,Math.min(1,(x-48)/(97-48)));
    for(let L=0;L<LAYERS;L++){
      const im=layerInst[L];
      let visible = top;
      if(top && x<46.5 && L<3) visible=false;
      if(top && x<43) visible=false;
      tmpO.position.set(x, y+0.3+LAYER_H*(LAYERS-L-0.5), 0); tmpO.scale.set(1, visible?1:0.0001, visible?1:0.0001); tmpO.updateMatrix(); im.setMatrixAt(i,tmpO.matrix);
      if(!visible) continue;
      if(x<46.5){ tmpC.copy(HEARTH_C); }
      else if(x<48){ tmpC.copy(RAW); }
      else {
        const c=(L+0.5)/LAYERS, diff=d-c;
        if(x<52.5 && L===0) heat(0.95,tmpC);
        else if(diff<-0.16) tmpC.copy(RAW);
        else if(diff<-0.06) tmpC.copy(DRY);
        else if(diff<0.12) heat(1-Math.abs(diff-0.02)/0.16,tmpC);
        else heat(Math.max(0,0.62-(diff-0.12)*1.5),tmpC);
      }
      im.setColorAt(i,tmpC);
    }
  }
  palletInst.instanceMatrix.needsUpdate=true;
  layerInst.forEach(im=>{ im.instanceMatrix.needsUpdate=true; im.instanceColor.needsUpdate=true; });

  // cooler trays
  const rot=t*0.12;
  for(let i=0;i<NT;i++){
    const th=i/NT*Math.PI*2 + rot;
    let trav=((th-FEED)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
    const f=trav/TRAVEL; const full=f<=1;
    tmpO.position.set(CX+Math.cos(th)*CR, 2.5, CZ+Math.sin(th)*CR); tmpO.rotation.set(0,-th,0);
    tmpO.scale.set(1, full?1:0.15, 1); tmpO.updateMatrix(); trayInst.setMatrixAt(i,tmpO.matrix);
    if(full) heat(0.88*Math.exp(-3.4*f),tmpC); else tmpC.set('#3a4148');
    trayInst.setColorAt(i,tmpC);
  }
  trayInst.instanceMatrix.needsUpdate=true; trayInst.instanceColor.needsUpdate=true;

  renderer.render(scene,camera);

  // labels
  const w=view.clientWidth, h=view.clientHeight;
  for(const L of labels){
    const show = L.area ? stage===0 : L.stage===stage;
    if(!show){ if(!L.el.hidden) L.el.hidden=true; continue; }
    tv.copy(L.p).project(camera);
    if(tv.z>1||tv.x<-1.1||tv.x>1.1||tv.y<-1.1||tv.y>1.1){ L.el.hidden=true; continue; }
    L.el.hidden=false;
    L.el.style.transform=`translate(${((tv.x+1)/2*w).toFixed(1)}px,${((1-tv.y)/2*h).toFixed(1)}px) translate(-50%,-100%)`;
  }
  requestAnimationFrame(frame);
}

document.getElementById('loading').hidden=true;
setStage(0);
cur.t.copy(goal.t); cur.r=goal.r*1.15; cur.th=goal.th-0.4; cur.ph=goal.ph;
requestAnimationFrame(frame);
})();
