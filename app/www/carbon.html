<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071426">
<title>Carbon Footprint CBAM</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="iz.css">
<style>
.big { margin-top: 12px; padding: 16px; border-radius: 18px; border: 1px solid rgba(60,207,142,.45); background: linear-gradient(160deg, rgba(60,207,142,.14), rgba(11,31,56,.9) 60%) }
.big .l { font: 600 12px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: #9fe6e3 }
.big .v { font: 700 54px/1 var(--f-display); margin-top: 6px } .big .v small { font: 500 15px var(--f-body); color: var(--muted); margin-left: 6px }
.big .sp { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; color: var(--ink-2) } .big .sp b { color: #fff }
.bar3 { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 12px; background: rgba(255,255,255,.06) } .bar3 i { display: block; height: 100% }
.lg { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 11.5px; color: var(--muted) } .lg span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; background: var(--c) }
.tabs { display: flex; gap: 6px; overflow-x: auto; margin-top: 12px; padding-bottom: 2px } .tabs button { flex: none; min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1px solid #2a4a70; background: transparent; color: var(--ink-2); font: 700 13.5px var(--f-body); cursor: pointer }
.tabs button.on { background: rgba(255,181,71,.14); border-color: var(--amber); color: #ffd9a8 }
.f .src { grid-column: 1 / -1; font: 500 11px var(--f-mono); color: var(--muted) } .f .src.link { color: #7fe0b8 } .f .src.user { color: #ffd27a }
.hit { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px solid rgba(29,53,83,.6); font-size: 13px }
.hit input { width: 20px; height: 20px; margin-top: 2px } .hit small { display: block; color: var(--muted); overflow-wrap: anywhere } .hit b { font-family: var(--f-mono); color: #ffd9a8 }
.gtxt p, .gtxt li { font-size: 13.5px; line-height: 1.55; color: var(--ink-2) } .gtxt h4 { margin: 14px 0 4px; font: 700 15px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: #ffd9a8 }
.gtxt code { font: 500 12.5px var(--f-mono); color: #9fe6e3 }
</style>
</head>
<body>
<header class="bar">
  <button class="bk" id="back" aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="tt"><small>Iron Making · all plants</small><b id="ttl">Carbon footprint</b></div>
  <a class="hm" id="home" href="index.html" aria-label="Iron Making first page"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h5v-6h4v6h5V10"/></svg><span>Iron Making</span></a>
  <button class="mn" id="menu" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
</header>
<main>
  <section class="page" id="p-dash"></section>
  <section class="page" id="p-input"></section>
  <section class="page" id="p-bal"></section>
  <section class="page" id="p-guide"></section>
</main>
<nav class="bn" aria-label="Pages" style="grid-template-columns:repeat(4,1fr)">
  <button data-p="dash"><span><svg class="ic" viewBox="0 0 24 24"><path d="M4 13a8 8 0 1 1 16 0M12 13l4-5M4 19h16"/></svg></span>Results</button>
  <button data-p="input"><span><svg class="ic" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></span>Inputs</button>
  <button data-p="bal"><span><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/></svg></span>Carbon balance</button>
  <button data-p="guide"><span><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></span>Method</button>
</nav>
<div class="toast" id="toast" role="status"></div>
<div class="sheetbg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Menu"></div>
<input type="file" id="file" accept=".xlsx,.xlsm,.xls,.csv,.txt,.pdf,application/pdf" hidden>
<script>window.IM_SINTER_URL = '../index.html';</script>
<script src="lib/xlsx.full.min.js"></script>
<script src="engine.js"></script>
<script src="carbon-engine.js"></script>
<script src="carbon-app.js"></script>
<script src="nk-logo.js" data-img="img/nk-logo.png" defer></script>
</body>
</html>
