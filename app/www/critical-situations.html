<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071426">
<title>Critical Situation Action Plan</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="iz.css">
<style>
:root { --crit: #ff5a4a; --high: #ff9a3c; --med: #ffd23c; --strat: #5aa9ff; --l1: #ffd23c; --l2: #ff9a3c; --l3: #ff5a4a }
.cs-logo { flex: none; width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(145deg, #ff5a4a, #ff9a3c); box-shadow: 0 12px 26px -14px rgba(255,90,74,.95) }
.cs-logo svg { width: 36px; height: 36px; fill: none; stroke: #2a0a04; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round }
.hero .top { display: flex; gap: 14px; align-items: center }
.hero h1 { font-size: clamp(24px, 6.6vw, 40px) }
.srch { display: flex; gap: 8px; margin-top: 12px } .srch input { flex: 1; min-height: 44px; padding: 10px 12px; border-radius: 12px; border: 1px solid #2a4a70; background: rgba(4,12,23,.6); color: var(--ink); font: 500 15px var(--f-body) }
.chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px } .chips button { flex: none; min-height: 36px; padding: 6px 12px; border-radius: 999px; border: 1px solid #2a4a70; background: transparent; color: var(--ink-2); font: 700 12.5px var(--f-body); cursor: pointer }
.chips button.on { background: rgba(255,181,71,.14); border-color: var(--amber); color: #ffd9a8 }
.chips button i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--c) }
.cat { margin: 18px 2px 6px; font: 700 13px var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: #9fe6e3 }
.sit { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 11px 12px; margin-top: 6px; border-radius: 14px; border: 1px solid #1d3a5c; border-left: 4px solid var(--c); background: rgba(11,31,56,.75); color: var(--ink); cursor: pointer; font: inherit }
.sit .id { font: 700 12px var(--f-mono); color: var(--muted) } .sit b { display: block; font-size: 14.5px; line-height: 1.25 } .sit small { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.sev { display: inline-block; padding: 3px 8px; border-radius: 999px; font: 700 10.5px/1.3 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: #120804; background: var(--c) }
.sev.Medium, .sev.L1 { color: #2a2000 }
.lv { margin-top: 10px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--c); border-left: 5px solid var(--c); background: color-mix(in srgb, var(--c) 9%, rgba(11,31,56,.9)) }
.lv h4 { margin: 0 0 6px; font: 700 14px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--c) } .lv p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink) }
.blk { margin-top: 10px } .blk h4 { margin: 0 0 4px; font: 700 12.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: #ffd27a } .blk p { margin: 0; font-size: 14px; line-height: 1.5 }
.blk.no { padding: 10px 12px; border-radius: 12px; background: rgba(255,90,74,.08); border: 1px solid rgba(255,90,74,.4) } .blk.no h4 { color: #ff8a7a }
.tr { margin-top: 10px; padding: 11px 12px; border-radius: 14px; border: 1px solid #1d3a5c; background: rgba(4,12,23,.45) }
.tr .h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline } .tr .h b { font-size: 14px } .tr .h button { flex: none; border: 1px solid #2a4a70; background: transparent; color: #9fe6e3; border-radius: 9px; padding: 4px 9px; font: 600 11.5px var(--f-body); cursor: pointer }
.band { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 8px } .band div { padding: 6px 7px; border-radius: 9px; font-size: 12px; line-height: 1.3; background: rgba(255,255,255,.04); border-top: 3px solid var(--c); overflow-wrap: anywhere }
.band small { display: block; font: 700 9.5px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--c); margin-bottom: 2px }
.tr .mean { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.45 } .tr .lim { margin-top: 6px; font: 600 12px var(--f-mono); color: #ffd27a }
@media (max-width: 420px) { .band { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.fur { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px } .fur span { padding: 5px 9px; border-radius: 9px; background: rgba(25,179,177,.1); border: 1px solid rgba(25,179,177,.3); font-size: 12px; color: #bff3f1 }
.nav2 { display: flex; gap: 8px; margin-top: 14px } .nav2 .btn { flex: 1 }
.f select { width: 100%; min-height: 40px; padding: 8px 10px; border-radius: 10px; border: 1px solid #2a4a70; background: rgba(4,12,23,.6); color: var(--ink); font: 500 14px var(--f-body) }
.f .src { grid-column: 1 / -1; font: 500 11px var(--f-mono); color: var(--muted) } .f .src.link { color: #7fe0b8 } .f .src.user { color: #ffd27a }
.f.wide { grid-template-columns: minmax(0, 1fr) } textarea { width: 100%; min-height: 86px; padding: 10px; border-radius: 10px; border: 1px solid #2a4a70; background: rgba(4,12,23,.6); color: var(--ink); font: 500 14px/1.45 var(--f-body); resize: vertical }
.opt { margin-top: 10px; padding: 10px 12px; border-radius: 14px; border: 1px solid #1d3a5c; background: rgba(4,12,23,.45) } .opt.best { border-color: #3ccf8e; box-shadow: 0 0 0 1px rgba(60,207,142,.35) } .opt.fail { border-color: rgba(255,90,74,.6) }
.opt .oh { display: flex; gap: 8px; align-items: center } .opt .oh input { flex: 1; min-height: 40px; padding: 8px 10px; border-radius: 10px; border: 1px solid #2a4a70; background: rgba(4,12,23,.6); color: var(--ink); font: 600 14px var(--f-body) }
.opt .oh button { flex: none; width: 40px; height: 40px; border-radius: 10px; border: 1px solid #2a4a70; background: transparent; color: #ff8a7a; font-size: 18px; cursor: pointer }
.sc { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 8px } .sc label { font: 600 10px var(--f-mono); text-transform: uppercase; color: var(--muted); text-align: center } .sc select { width: 100%; min-height: 38px; border-radius: 9px; border: 1px solid #2a4a70; background: rgba(4,12,23,.6); color: var(--ink); font: 700 15px var(--f-mono); text-align: center }
.opt .res { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12.5px; color: var(--ink-2) } .opt .res b { color: #fff; font-family: var(--f-mono) }
.wts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px } .wts label { font: 600 10px var(--f-mono); text-transform: uppercase; color: var(--muted); text-align: center } .wts input { width: 100%; min-height: 40px; border-radius: 9px; border: 1px solid #2a4a70; background: rgba(4,12,23,.6); color: var(--ink); font: 700 15px var(--f-mono); text-align: center }
.idea { margin-top: 10px; padding: 11px 12px; border-radius: 14px; border: 1px solid #1d3a5c; border-left: 4px solid var(--c); background: rgba(11,31,56,.75) }
.idea .ih { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 12px; color: var(--muted) } .idea p { margin: 6px 0 0; font-size: 14px; line-height: 1.45 } .idea .why { color: var(--ink-2); font-size: 13px }
.idea .act { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px }
.st-New { --c: #5aa9ff } .st-Under { --c: #ffd23c } .st-Approved { --c: #3ccf8e } .st-Rejected { --c: #93a6ba }
.gtxt p, .gtxt li { font-size: 13.5px; line-height: 1.55; color: var(--ink-2) } .gtxt h4 { margin: 14px 0 4px; font: 700 15px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: #ffd9a8 }
.mini { width: 100%; border-collapse: collapse; font-size: 13px } .mini td, .mini th { padding: 6px; border-bottom: 1px solid rgba(29,53,83,.6); text-align: left; vertical-align: top } .mini th { font: 600 11px var(--f-mono); text-transform: uppercase; color: var(--muted) } .mini td.n { text-align: right; font-family: var(--f-mono); color: #fff }
.scroll { overflow-x: auto }
</style>
</head>
<body>
<header class="bar">
  <button class="bk" id="back" aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="tt"><small>BF Model · action plan</small><b id="ttl">Critical situations</b></div>
  <a class="hm" id="home" href="bf-home.html" aria-label="BF Model home"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h5v-6h4v6h5V10"/></svg><span>BF Model</span></a>
  <button class="mn" id="menu" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
</header>
<main>
  <section class="page" id="p-list"></section>
  <section class="page" id="p-sit"></section>
  <section class="page" id="p-input"></section>
  <section class="page" id="p-dm"></section>
  <section class="page" id="p-ideas"></section>
  <section class="page" id="p-guide"></section>
</main>
<nav class="bn" aria-label="Pages" style="grid-template-columns:repeat(5,1fr)">
  <button data-p="list"><span><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg></span>Situations</button>
  <button data-p="input"><span><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h10M4 12h6M4 18h12M17 4v4M13 10v4M19 16v4"/></svg></span>My furnace</button>
  <button data-p="dm"><span><svg class="ic" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Compare</button>
  <button data-p="ideas"><span><svg class="ic" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></span>Ideas</button>

</nav>
