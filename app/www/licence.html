<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071426">
<title>Activate Iron Making</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="im.css">
<style>
/* Computer copies (Windows, Mac, Office PC): free for every login; registers this computer (max 2). */
[hidden] { display: none !important }
.card { max-width: 560px; margin: 8vh auto 0; padding: 20px; border-radius: 18px; border: 1px solid var(--line); background: rgba(11,31,56,.82); display: grid; gap: 12px }
h1 { margin: 0; font: 700 30px/1.05 var(--f-display); letter-spacing: .04em; text-transform: uppercase }
p { margin: 0; color: var(--ink-2) }
.mono { font: 12.5px/1.5 var(--f-mono); color: var(--muted); overflow-wrap: anywhere }
.btn { display: flex; align-items: center; justify-content: center; min-height: 46px; padding: 8px 14px; border-radius: 12px; text-decoration: none; font: 700 15px var(--f-body); cursor: pointer; border: 1px solid rgba(255,181,71,.5); background: none; color: #fff }
.btn.main { background: var(--molten); color: #2a1200; border: 0 }
.btn:disabled { opacity: .5 }
.state { padding: 12px; border-radius: 12px }
.state.err { background: rgba(179,38,30,.22); border: 1px solid #ff8a80 } .state.ok { background: rgba(35,112,58,.25); border: 1px solid #72c784 }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 id="title">Activating…</h1>
    <p id="text">Setting up this computer. Internet is needed for this step.</p>
    <div class="state" id="state" hidden></div>
    <button class="btn main" type="button" id="retry" hidden>Try again</button>
    <a class="btn main" id="buy" href="store.html" hidden>Get this version</a>
    <button class="btn" type="button" id="logout">Log out and use another account</button>
    <p class="mono" id="who"></p>
  </div>
</div>
<script src="auth-config.js"></script>
<script src="auth-api.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var P = window.IMPlatform || { id: 'web', paid: false };
  var u = null; try { u = JSON.parse(localStorage.getItem('bf-user') || 'null'); } catch (e) { }
  if (!P.paid || (u && u.cloudAdmin)) { location.replace('index.html'); return; }
  $('who').textContent = 'Logged in as ' + (u && (u.name || u.loginId)) + ' (' + (u && u.loginId) + ') · ' + P.name + ' · computer ID ' + P.device().slice(-8);
  function show(title, text, cls, msg) { $('title').textContent = title; $('text').textContent = text; var s = $('state'); s.hidden = !msg; s.className = 'state ' + (cls || ''); s.textContent = msg || ''; }
  function run() {
    $('retry').hidden = true; $('buy').hidden = true; show('Activating…', 'Setting up this computer. Internet is needed for this step.');
    IMCloud.userCall('licence', { platform: P.id, device: P.device(), deviceName: P.deviceName() }).then(function (r) {
      if (r.licensed) {
        try { localStorage.setItem('im.lic', JSON.stringify({ id: u.loginId, platform: P.id, device: P.device(), exp: r.exp, checked: Date.now(), slot: r.slot, order: r.order, update: r.update || null })); } catch (e) { }
        show('Activated', 'Iron Making for ' + r.version + ' is activated on this computer (' + r.slot + ' of ' + r.maxDevices + ').', 'ok', 'Opening the app…');
        setTimeout(function () { location.replace('index.html'); }, 1200);
      } else if (r.locked) {
        show('Locked by the admin', 'Iron Making for ' + r.version + ' opens only for users the admin allows. Your login ' + u.loginId + (r.denied ? ' is not allowed.' : ' is not allowed yet.'), 'err',
          r.denied ? 'Contact the admin.' : 'Tap "Request access", wait for the admin to allow you, then tap Try again.');
        $('buy').textContent = 'Request access'; $('buy').hidden = !!r.denied; $('retry').hidden = false;
      } else if (r.reason === 'unpaid') {
        show('Not activated', 'This copy of Iron Making for ' + r.version + ' could not be activated for your login ' + u.loginId + '.', 'err',
          'Ask the admin to check it, then tap Try again.');
        $('buy').hidden = false; $('retry').hidden = false;
      } else if (r.reason === 'devices') {
        show('Already used on ' + r.maxDevices + ' computers', 'Iron Making for ' + r.version + ' is already active on ' + r.maxDevices + ' computers: ' + (r.devices || []).filter(String).map(function (d, i) { return (i + 1) + ') ' + d; }).join(', ') + '.', 'err',
          'To move it to this computer, ask the admin to reset your computers, then tap Try again.');
        $('retry').hidden = false;
      } else if (r.reason === 'blocked') {
        show('Licence blocked', 'The admin has blocked this licence' + (r.note ? ': ' + r.note : '.'), 'err', 'Contact the admin.');
        $('retry').hidden = false;
      }
    }, function (e) {
      show('No connection', 'Activation needs the internet once on each computer, and then once every 30 days.', 'err', e.message);
      $('retry').hidden = false;
    });
  }
  $('retry').addEventListener('click', run);
  $('logout').addEventListener('click', function () { if (window.BFAuth) BFAuth.signOut(); try { localStorage.removeItem('im.lic'); } catch (e) { } location.replace('auth.html'); });
  (function start() { if (!window.IMCloud) return setTimeout(start, 50); run(); })();
})();
</script>
</body>
</html>
