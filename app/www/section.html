<!doctype html>

<head>

<title>Iron Making · Section</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="im.css">
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Iron Making</a>
  <header class="hero"><img id="img" src="img/process/bf.webp" alt="" width="1200" height="640"><div class="cap"><div class="eb" id="eb"></div><h1 id="ttl"></h1></div></header>
  <p class="lead" id="lead"></p>
  <div id="tool"></div>
  <section class="wip" aria-labelledby="wiph">
    <div class="row"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg></span><h2 id="wiph">Under progress</h2></div>
    <p id="wipText"></p>
    <div class="bar" aria-hidden="true"><i></i></div>
    <ul class="soon" id="soon"></ul>
  </section>
  <div class="foot"><span>Iron Making 5.9</span><span id="sname"></span></div>
</div>
<script>
(function () {
  var S = {
    bf: { img: 'bf', eb: 'Section 05', t: 'Blast furnace',
      lead: 'Sinter, pellet, lump ore and coke are charged at the top; hot blast and injected fuel at the tuyeres reduce the burden to liquid pig iron and slag, tapped from the hearth.',
      tool: { href: 'bf-home.html', b: 'BF Model', s: 'Burden batch chemistry, burden calculator, 3D distribution, furnace 3D view, cohesive zone, hearth liquid, cost optimiser, action plan against critical situations, taphole check with 3D, tuyere watch, water cooling requirement and report.' },
      soon: ['Process overview: zones of the furnace and what happens in each', 'Daily operating KPIs: productivity, fuel rate, coke rate, PCI, hot metal Si and temperature', 'Shift checklists'] },
    sinter: { img: 'sinter', eb: 'Section 02', t: 'Sinter plant',
      lead: 'Iron ore fines, flux, return fines and coke breeze are mixed, ignited and sintered on the travelling strand into a strong, reducible feed for the blast furnace.',
      tool3: { href: '../how-sinter.html', b: 'How sinter is made · 3D animation', s: 'Ore fines to blast-furnace sinter, step by step: proportioning, mixing, ignition, strand, cooling and screening.' },
      tool2: { href: '../sinter-critical.html', b: 'Sinter critical decisions · 3D', s: '64 critical situations in 12 plant areas: severity (A minutes, B shift, C days), why it matters and what to do, with the affected part of the plant lit up in 3D.' },
      tool: { href: '../index.html', b: 'Sinter Predict', s: 'Predict sinter chemistry and quality from the blend and machine settings, compare with lab results and export the report.' },
      soon: ['Process overview: proportioning, mixing, ignition, strand, cooler and screening', 'Sinter quality KPIs: TI, RDI, RI, FeO, basicity and yield', 'Shift checklists'] },
    coke: { img: 'coke', eb: 'Section 04', t: 'Coke oven',
      lead: 'A blend of coking coals is carbonised in the oven battery, pushed and quenched to give the strong, porous coke that carries the blast furnace burden and supplies its heat.',
      tool3: { href: '../xco/how-coke.html', b: 'How coke is made · 3D animation', s: 'Coal yard to blast-furnace coke, step by step: crushing, charging, carbonisation, pushing and quenching.' },
      tool2: { href: '../xco/coke-critical.html', b: 'Coke oven critical decisions · 3D', s: '56 critical situations in 12 battery areas: severity (A minutes, B shift, C days), why it matters and what to do, with the affected part of the battery lit up in 3D.' },
      tool: { href: '../xco/index.html', b: 'Coke Making', s: 'Coke quality (CSR, CRI, M40, M10), yield, mass & heat balance and corrective actions. Upload the Excel or enter values by hand; missing values can be taken from the reference data. Works offline.' },
      soon: ['Process overview: coal handling, charging, carbonisation, pushing and quenching', 'Coke quality KPIs: CSR, CRI, M40, M10, ash and moisture', 'Shift checklists'] },
    pellet: { img: 'pellet', eb: 'Section 03', t: 'Pellet plant',
      lead: 'Fine iron ore concentrate is ground, mixed with binder and balled into green pellets, then dried, preheated and fired in the grate-kiln before cooling.',
      tool: null,
      soon: ['Process overview: grinding, balling, travelling grate, rotary kiln and annular cooler', 'Pellet quality KPIs: CCS, tumbler index, porosity, reducibility and swelling', 'Pellet plant calculator'] }
  };
  function show() {
    var k = (location.hash || '#bf').slice(1); var s = S[k] || S.bf; if (!S[k]) k = 'bf';
    document.title = 'Iron Making · ' + s.t;
    document.getElementById('img').src = 'img/process/' + s.img + '.webp';
    document.getElementById('img').alt = s.t;
    document.getElementById('eb').textContent = s.eb;
    document.getElementById('ttl').textContent = s.t;
    document.getElementById('lead').textContent = s.lead;
    document.getElementById('sname').textContent = s.t;
    var tool = document.getElementById('tool');
    tool.innerHTML = s.tool ? '<a class="open" href="' + s.tool.href + '"><span><b>' + s.tool.b + '</b><small>' + s.tool.s + '</small></span><span class="btn">Open ›</span></a>' : ''
    if (s.tool3) tool.innerHTML += '<a class="open" style="margin-top:10px" href="' + s.tool3.href + '"><span><b>' + s.tool3.b + '</b><small>' + s.tool3.s + '</small></span><span class="btn">Open ›</span></a>';
    if (s.tool2) tool.innerHTML += '<a class="open" style="margin-top:10px" href="' + s.tool2.href + '"><span><b>' + s.tool2.b + '</b><small>' + s.tool2.s + '</small></span><span class="btn">Open ›</span></a>';
    document.getElementById('wipText').textContent = s.tool
      ? 'More information for the ' + s.t.toLowerCase() + ' section is being prepared and will be added in a future update. The ' + s.tool.b + ' tool above is ready to use now.'
      : 'This section is being prepared. Information and tools for the pellet plant will be added in a future update.';
    document.getElementById('soon').innerHTML = s.soon.map(function (x) { return '<li><b>Coming:</b> ' + x + '</li>'; }).join('');
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', show); show();
})();
</script>
<script src="nk-logo.js" data-img="img/nk-logo.png" defer></script>
</body>
</html>
