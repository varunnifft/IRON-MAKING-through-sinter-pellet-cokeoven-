<style>
:root { --hi: #ff5a4a; --md: #ffb547; --lo: #5aa9ff; --ok: #3ccf8e }
.th-logo { flex: none; width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(145deg, #ff7a1a, #ffc23d); box-shadow: 0 12px 26px -14px rgba(255,122,26,.95) }
.th-logo svg { width: 38px; height: 38px }
.hero .top { display: flex; gap: 14px; align-items: center } .hero h1 { font-size: clamp(26px, 7.4vw, 42px) }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 2px } .steps button { min-height: 44px; border-radius: 12px; border: 1px solid #2a4a70; background: transparent; color: var(--muted); font: 700 11.5px/1.15 var(--f-body); cursor: pointer; padding: 4px }
.steps button b { display: block; font: 700 15px var(--f-display) } .steps button.on { background: rgba(255,181,71,.14); border-color: var(--amber); color: #ffd9a8 } .steps button.done { color: #7fe0b8; border-color: rgba(60,207,142,.45) }
.steps button:disabled { opacity: .45; cursor: default }
.nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px } .nums button { min-height: 64px; border-radius: 14px; border: 1px solid #2a4a70; background: rgba(4,12,23,.5); color: var(--ink); font: 700 26px var(--f-display); cursor: pointer }
.nums button.on { background: var(--molten); color: #2a1200; border-color: #ffb066 }
.thc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px } .thc button { min-width: 72px; min-height: 46px; border-radius: 12px; border: 1px solid #2a4a70; background: rgba(4,12,23,.5); color: var(--ink); font: 700 15px var(--f-mono); cursor: pointer }
.thc button.on { background: rgba(255,181,71,.18); border-color: var(--amber); color: #ffd9a8 }
.f select, .f input[type=date] { width: 100%; min-height: 40px; padding: 8px 10px; border-radius: 10px; border: 1px solid #2a4a70; background: rgba(4,12,23,.6); color: var(--ink); font: 500 14px var(--f-body) }
.f input.tx { text-align: left; font-family: var(--f-body) }
.stg { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; margin-top: 10px; padding: 14px; border-radius: 16px; border: 1px solid #1d3a5c; border-left: 5px solid var(--c); background: rgba(11,31,56,.8); color: var(--ink); font: inherit; cursor: pointer }
.stg .L { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font: 700 26px var(--f-display); background: color-mix(in srgb, var(--c) 22%, transparent); color: var(--c); border: 1px solid var(--c) }
.stg b { display: block; font: 700 18px/1.1 var(--f-display); letter-spacing: .06em; text-transform: uppercase } .stg small { display: block; margin-top: 3px; color: var(--muted); font-size: 12.5px }
.stg .cnt { font: 700 12px var(--f-mono); color: var(--muted); text-align: right } .stg .cnt em { display: block; font-style: normal; color: #ff8a7a }
.ab { margin-top: 10px; padding: 12px; border-radius: 14px; border: 1px solid #1d3a5c; background: rgba(4,12,23,.45) } .ab.y { border-color: rgba(255,90,74,.6); background: rgba(255,90,74,.07) } .ab.n { opacity: .8 }
.ab .h { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start } .ab b { font-size: 15px; line-height: 1.25 } .ab p { margin: 5px 0 0; font-size: 13px; color: var(--ink-2); line-height: 1.4 }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px } .yn button { min-height: 46px; border-radius: 12px; border: 1px solid #2a4a70; background: transparent; color: var(--ink-2); font: 700 15px var(--f-body); cursor: pointer }
.yn button.Y.on { background: rgba(255,90,74,.2); border-color: #ff5a4a; color: #ffb3a8 } .yn button.N.on { background: rgba(60,207,142,.16); border-color: #3ccf8e; color: #9ff0c9 }
.pri { display: inline-block; padding: 3px 8px; border-radius: 999px; font: 700 10.5px/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: #160804; background: var(--c); white-space: nowrap }
.pri.Medium { color: #2a1a00 }
.ban { margin-top: 12px; padding: 16px; border-radius: 16px; border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 13%, rgba(11,31,56,.92)) } .ban b { display: block; font: 700 24px/1.1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; color: var(--c) }
.ban small { display: block; margin-top: 6px; color: var(--ink-2); font-size: 13px }
.res { margin-top: 12px; padding: 14px; border-radius: 16px; border: 1px solid #1d3a5c; border-left: 5px solid var(--c); background: rgba(11,31,56,.85) }
.res h3 { margin: 6px 0 2px; font: 700 19px/1.15 var(--f-display); letter-spacing: .04em; text-transform: uppercase } .res .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted) }
.blk { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(4,12,23,.45); border: 1px solid #1d3a5c } .blk h4 { margin: 0 0 4px; font: 700 12px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--c2, #ffd27a) } .blk p { margin: 0; font-size: 14px; line-height: 1.5 }
.blk.im { --c2: #ff8a7a; border-color: rgba(255,90,74,.45); background: rgba(255,90,74,.07) } .blk.la { --c2: #7fe0b8; border-color: rgba(60,207,142,.4); background: rgba(60,207,142,.06) } .blk.ca { --c2: #9fd0ff }
.rec { margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: rgba(255,90,74,.12); border: 1px solid rgba(255,90,74,.5); color: #ffb3a8; font-size: 13px; font-weight: 700 }
.kk { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px } .kk div { padding: 12px; border-radius: 14px; border: 1px solid #1d3a5c; border-top: 3px solid var(--c); background: rgba(11,31,56,.8) }
.kk small { display: block; font: 600 11px var(--f-mono); text-transform: uppercase; color: var(--muted) } .kk b { display: block; margin-top: 4px; font: 700 30px/1 var(--f-display) }
@media (min-width: 640px) { .kk { grid-template-columns: repeat(4, 1fr) } }
.mx { width: 100%; border-collapse: collapse; font-size: 12.5px } .mx th, .mx td { padding: 6px 5px; border-bottom: 1px solid rgba(29,53,83,.6); text-align: center } .mx th { font: 600 10.5px var(--f-mono); text-transform: uppercase; color: var(--muted) }
.mx td:first-child, .mx th:first-child { text-align: left } .mx td.z { color: #3b5370 } .mx td.v { color: #fff; font-weight: 700; background: rgba(255,122,26,.12) } .mx tr.g td { font: 700 11px var(--f-mono); text-transform: uppercase; color: #9fe6e3; background: rgba(25,179,177,.06); text-align: left }
.scroll { overflow-x: auto }
.lg { margin-top: 10px; padding: 11px 12px; border-radius: 14px; border: 1px solid #1d3a5c; border-left: 4px solid var(--c); background: rgba(11,31,56,.8) } .lg .t { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted) }
.lg b { display: block; margin-top: 4px; font-size: 14.5px } .lg p { margin: 4px 0 0; font-size: 13px; color: var(--ink-2) } .lg .act { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px }
.chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px } .chips button { flex: none; min-height: 36px; padding: 6px 12px; border-radius: 999px; border: 1px solid #2a4a70; background: transparent; color: var(--ink-2); font: 700 12.5px var(--f-body); cursor: pointer }
.chips button.on { background: rgba(255,181,71,.14); border-color: var(--amber); color: #ffd9a8 }
textarea { width: 100%; min-height: 70px; padding: 9px; border-radius: 10px; border: 1px solid #2a4a70; background: rgba(4,12,23,.6); color: var(--ink); font: 500 14px/1.45 var(--f-body); resize: vertical }
.f.wide { grid-template-columns: minmax(0, 1fr) }
.gtxt p { font-size: 13.5px; line-height: 1.55; color: var(--ink-2); margin: 4px 0 0 } .gtxt h4 { margin: 14px 0 0; font: 700 15px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: #ffd9a8 }
.mods a { display: flex; gap: 10px; align-items: center; padding: 11px 4px; border-bottom: 1px solid rgba(29,53,83,.6); color: var(--ink); text-decoration: none; font-size: 14.5px } .mods a span { width: 30px; font: 700 12px var(--f-mono); color: var(--muted) } .mods a.cur { color: #ffd9a8 }
.foot2 { display: flex; gap: 8px; margin-top: 14px } .foot2 .btn { flex: 1 }
.t3 { position: relative; height: min(58vh, 100vw); min-height: 280px; max-height: 560px; border-radius: 14px; overflow: hidden; background: #060b12; touch-action: none; border: 1px solid #1d3a5c }
.t3 canvas { display: block; cursor: grab; width: 100% !important; height: 100% !important } .t3 canvas:active { cursor: grabbing }
.t3-lab { position: absolute; inset: 0; pointer-events: none; overflow: hidden }
.t3-lab span { position: absolute; left: 0; top: 0; white-space: nowrap; font: 600 10px/1.2 var(--f-body); color: #d6e3ef; background: rgba(6,12,20,.66); border: 1px solid rgba(160,196,226,.18); padding: 2px 5px; border-radius: 7px; translate: -50% -50% }
.t3-lab span.call { color: #fff; background: rgba(184,65,12,.92); border-color: #ffb547; font-size: 11px; translate: -50% calc(-100% - 8px); box-shadow: 0 6px 16px -6px rgba(0,0,0,.8) }
.t3-lab span.call::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 2px; height: 8px; background: #ffb547; translate: -50% 0 }
.t3-lab span i { font-style: normal; display: inline-grid; place-items: center; width: 16px; height: 16px; margin-right: 5px; border-radius: 50%; background: #fff; color: #b8410c; font: 700 10px var(--f-mono) }
.t3-hud { position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; pointer-events: none }
.t3-hud span { font: 600 11.5px var(--f-body); padding: 4px 9px; border-radius: 8px; background: rgba(6,12,20,.78); border-left: 4px solid #8fa1b4; color: #eef3f8 }
.t3-hud .h3 { border-color: #ff5a6e } .t3-hud .h2 { border-color: #ff9a5c } .t3-hud .h1 { border-color: #ffd166 } .t3-hud .h0 { border-color: #4fd6a2 }
.t3-err { padding: 40px 20px; text-align: center; color: #c3d0dd }
.t3-tag { position: absolute; right: 10px; top: 10px; font: 700 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 5px 9px; border-radius: 8px; pointer-events: none } .t3-tag.ab { background: #b8410c; color: #fff } .t3-tag.nm { background: #12805c; color: #fff }
.vbar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px } .vbar button { min-height: 36px; padding: 6px 11px; border-radius: 10px; border: 1px solid #2a4a70; background: transparent; color: var(--ink-2); font: 700 12.5px var(--f-body); cursor: pointer }
.vbar button[aria-pressed=true] { background: rgba(255,181,71,.16); border-color: var(--amber); color: #ffd9a8 } .vbar button.cmp[aria-pressed=true] { background: rgba(60,207,142,.16); border-color: #3ccf8e; color: #9ff0c9 }
.cap { margin: 8px 2px 0; font-size: 13.5px; line-height: 1.45; color: var(--ink-2) } .leg { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 4px } .leg li { font-size: 13px } .leg i { font-style: normal; display: inline-grid; place-items: center; width: 18px; height: 18px; margin-right: 6px; border-radius: 50%; background: #ffb547; color: #2a1200; font: 700 11px var(--f-mono) }
.hint3 { font-size: 11.5px; color: var(--muted); margin: 6px 2px 0 }
.g3 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px } @media (min-width: 640px) { .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
.g3 button { padding: 0; border-radius: 13px; border: 1px solid #1d3a5c; border-top: 3px solid var(--c); background: rgba(11,31,56,.85); color: var(--ink); text-align: left; overflow: hidden; cursor: pointer; font: inherit }
.g3 .pic { display: block; aspect-ratio: 16 / 10; background: #060b12 center / cover no-repeat } .g3 .tx { display: block; padding: 7px 9px 9px } .g3 b { display: block; font-size: 13px; line-height: 1.2 } .g3 small { display: block; margin-top: 3px; font: 600 10.5px var(--f-mono); color: var(--muted) }
.b3 { display: inline-flex; align-items: center; gap: 4px; min-height: 30px; padding: 4px 10px; border-radius: 9px; border: 1px solid rgba(25,179,177,.5); background: rgba(25,179,177,.1); color: #9fe6e3; font: 700 12px var(--f-body); cursor: pointer; white-space: nowrap }
.pat { margin-top: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(255,181,71,.5); background: rgba(255,181,71,.08) } .pat b { color: #ffd27a } .pat p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.45 }
.pn3 { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px } .pn3 button { flex: 1; min-height: 42px; border-radius: 11px; border: 1px solid #2a4a70; background: transparent; color: #9fe6e3; font: 600 12.5px var(--f-body); cursor: pointer }
</style>
