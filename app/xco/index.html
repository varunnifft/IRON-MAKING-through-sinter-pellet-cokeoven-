<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a44">
<title>Coke Making</title>
<link rel="stylesheet" href="coke.css">
</head>
<body>
<header class="bar">
  <button class="bk" id="back" aria-label="Back" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb547"/><stop offset="1" stop-color="#ff4d0d"/></linearGradient></defs>
    <path d="M3 27 L11 13 L15 18 L21 8 L31 27Z" fill="#2a2d35" stroke="#5a6070" stroke-width="1"/><path d="M21 8 L24 13 L21 12 L18 13Z" fill="#8a909c"/><path d="M3 27h28v3H3z" fill="url(#lg1)"/><circle cx="27" cy="7" r="2.5" fill="#ffb547"/></svg>
  <div class="tt"><small>Coke making</small><b id="ttl">Home</b></div>
  <button class="mn" id="menu" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
</header>
<main id="main">
  <section class="page" id="p-home"></section>
  <section class="page" id="p-input"></section>
  <section class="page" id="p-results"></section>
  <section class="page" id="p-balance"></section>
  <section class="page" id="p-actions"></section>
</main>
<nav class="bn" aria-label="Pages">
  <button data-p="home"><span><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Home</button>
  <button data-p="input"><span><svg class="ic" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></span>Inputs</button>
  <button data-p="results"><span><svg class="ic" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Results</button>
  <button data-p="balance"><span><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v18M5 7h14M5 7l-3 7a4 4 0 0 0 6 0zM19 7l-3 7a4 4 0 0 0 6 0zM8 21h8"/></svg></span>Balance</button>
  <button data-p="actions"><span><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l9 16H3zM12 10v4M12 17v.5"/></svg></span>Actions</button>
</nav>
<div class="toast" id="toast" role="status"></div>
<div class="sheetbg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Menu"></div>
<input type="file" id="file" accept=".xlsx,.xlsm,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
<script src="lib/xlsx.full.min.js"></script>
<script src="coke-ref.js"></script>
<script src="coke-engine.js"></script>
<script src="coke-app.js"></script>
<script src="nk-logo.js" data-img="nk-logo.png" defer></script>
<script src="im-back.js"></script>
