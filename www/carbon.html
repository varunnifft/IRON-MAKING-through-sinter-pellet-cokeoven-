<title>Carbon Footprint CBAM</title>
<link rel="stylesheet" href="fonts.css">

<style>
.big { margin-top: 12px; padding: 16px; border-radius: 18px; border: 1px solid rgba(60,207,142,.45); background: linear-gradient(160deg, rgba(60,207,142,.14), rgba(11,31,56,.9) 60%) }
.big .l { font: 600 12px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: #9fe6e3 }
.big .v { font: 700 54px/1 var(--f-display); margin-top: 6px } .big .v small { font: 500 15px var(--f-body); color: var(--muted); margin-left: 6px }
.big .sp { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; color: var(--ink-2) } .big .sp b { color: #fff }
.bar3 { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 12px; background: rgba(255,255,255,.06) } .bar3 i { display: block; height: 100% }
.lg { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 11.5px; color: var(--muted) } .lg span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; background: var(--c) }
.tabs { display: flex; gap: 6px; overflow-x: auto; margin-top: 12px; padding-bottom: 2px } .tabs button { flex: none; min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1px solid #2a4a70; background: transparent; color: var(--ink-2); font: 700 13.5px var(--f-body); cursor: pointer }
.tabs button.on { background: rgba(255,181,71,.14); border-color: var(--amber); color: #ffd9a8 }
.f .src { grid-column: 1 / -1; font: 500 11px var(--f-mono); color: var(--muted) } .f .src.link { color: #7fe0b8 } .f .src.user { color: #ffd27a }
.hit { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px solid rgba(29,53,83,.6); font-size: 13px }
.hit input { width: 20px; height: 20px; margin-top: 2px } .hit small { display: block; color: var(--muted); overflow-wrap: anywhere } .hit b { font-family: var(--f-mono); color: #ffd9a8 }
.gtxt p, .gtxt li { font-size: 13.5px; line-height: 1.55; color: var(--ink-2) } .gtxt h4 { margin: 14px 0 4px; font: 700 15px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: #ffd9a8 }
.gtxt code { font: 500 12.5px var(--f-mono); color: #9fe6e3 }
.k.tap { cursor: pointer; border-color: #2a4a70; transition: transform .12s } .k.tap:active { transform: scale(.98) }
.k.tap .go { position: absolute; right: 10px; top: 9px; font: 600 11px var(--f-mono); color: #ffd27a }
.qk { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px }
.qk button { min-height: 46px; border-radius: 12px; border: 1px solid #2a4a70; background: rgba(4,12,23,.5); color: #fff; font: 700 14px var(--f-body); cursor: pointer; text-align: left; padding: 8px 12px; border-left: 4px solid var(--c) }
.qk button small { display: block; font: 500 11px var(--f-mono); color: var(--muted) }
.wres { position: sticky; top: 62px; z-index: 5; margin-top: 10px; padding: 12px 14px; border-radius: 16px; border: 1px solid rgba(255,181,71,.45); background: linear-gradient(160deg, rgba(40,28,8,.96), rgba(11,31,56,.97) 65%); box-shadow: 0 10px 24px rgba(0,0,0,.4) }
.wres .row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap } .wres .v { font: 700 38px/1 var(--f-display) } .wres .u { font-size: 13px; color: var(--muted) }
.wres .d { font: 700 13px var(--f-mono); padding: 3px 8px; border-radius: 99px; background: rgba(255,255,255,.08) } .wres .d.up { color: #ff8a7a } .wres .d.dn { color: #7fe0b8 }
.wres .sp { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 12.5px; color: var(--ink-2) } .wres .sp b { color: #fff }
.f.chg input { border-color: var(--amber); background: rgba(255,181,71,.10) } .f .was { grid-column: 1 / -1; font: 500 11px var(--f-mono); color: var(--muted) } .f.chg .was { color: #ffd27a }
.how div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 7px 0; border-top: 1px solid rgba(29,53,83,.6); font-size: 13px }
.how div small { grid-column: 1 / -1; font: 500 11.5px/1.4 var(--f-mono); color: #9fe6e3 } .how div b { font-family: var(--f-mono); color: #ffd9a8; white-space: nowrap }
.how .tot { border-top: 1px solid #2a4a70; font-weight: 700 } .how h4 { margin: 14px 0 2px; font: 700 13px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--amber) }
.plsw { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px } .plsw button { flex: none; min-height: 38px; padding: 6px 13px; border-radius: 99px; border: 1px solid #2a4a70; background: transparent; color: var(--ink-2); font: 700 13px var(--f-body) }
.plsw button.on { background: rgba(255,181,71,.14); border-color: var(--amber); color: #ffd9a8 }
</style>
